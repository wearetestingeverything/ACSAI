<!DOCTYPE html>
<html lang="de">

        :root {
            --bg-base: #040812;
            --bg-surface: rgba(13, 22, 41, 0.7);
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff0055;
            --accent-green: #00ff88;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(0, 240, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(ff, 0, 85, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(4, 8, 18, 0.92), rgba(4, 8, 18, 0.92)),
                url('data:image/svg+xml;utf8,<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg"><path d="M0 40L40 0H0v40zM40 40V0L0 40h40z" fill="%2300f0ff" fill-opacity="0.015"/></svg>');
        }

        /* Nav Header */
        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            background: rgba(8, 14, 28, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 0.8rem 2rem;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            font-size: 1.5rem;
            color: var(--accent-cyan);
            filter: drop-shadow(0 0 8px var(--accent-cyan));
        }

        .brand-text {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

            display: flex;
            gap: 2rem;
        }
